services:
  - type: web
    name: git-merge-conflict-visualizer-backend
    runtime: docker
    plan: free
    repo: https://github.com/jayant1906/git-merge-conflict-visualizer
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit

  - type: web
    name: git-merge-conflict-visualizer-frontend
    runtime: static
    repo: https://github.com/jayant1906/git-merge-conflict-visualizer
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://git-merge-conflict-visualizer-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
